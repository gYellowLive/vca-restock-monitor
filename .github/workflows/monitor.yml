name: VCA Restock Monitor
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'check=正常检测；dry-run=只检测；test-email/test-bark/test-all=通知测试'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - check
          - test-email
          - test-bark
          - test-all
permissions:
  contents: read
concurrency:
  group: vca-restock-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Chromium
        if: github.event_name == 'schedule' || inputs.mode == 'check' || inputs.mode == 'dry-run'
        run: python -m playwright install --with-deps chromium
      - name: Run monitor or test
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          MODE: ${{ inputs.mode || 'check' }}
        shell: bash
        run: |
          case "$MODE" in
            check) python monitor.py ;;
            dry-run) python monitor.py --dry-run ;;
            test-email) python monitor.py --test-email ;;
            test-bark) python monitor.py --test-bark ;;
            test-all) python monitor.py --test-all ;;
            *) echo 'Unsupported mode'; exit 1 ;;
          esac
      - name: Upload screenshot and result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vca-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
